[project]
name = "profkeep"
version = "0.1.0"
description = "基金账本 TUI 应用"
readme = "README.md"
authors = [
    { name = "潭渊", email = "CNife@vip.qq.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.0.1",
    "sqlalchemy>=2.0.48",
    "sqlmodel>=0.0.37",
    "textual>=8.1.1",
    "tushare>=1.4.25",
]

[project.scripts]
profkeep = "profkeep.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["profkeep"]
